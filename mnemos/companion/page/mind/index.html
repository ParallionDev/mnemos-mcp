<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>The mind</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/room.css">
<style>
/* The mind (first made as "Still warm", the log's second view). The mind you come back to, lit only where its last
   hour went, cooling at the real rate since the hour ended: light arrives white and leaves like phosphor. Below it,
   on paper, what the hour left. Beside it, a drawer for reading everything it holds. The frame speaks of the mind in
   the third person; only its own words say "I". Its typefaces ship with Mnemos (../shared/fonts.css). */
:root{
  --floor:#060608;--raised:#0b0b0e;--raised-2:#101014;
  /* the same readable greys as the shared room: every grey that carries words passes WCAG AA for small text */
  --ink-1:rgba(236,239,244,.94);--ink-2:rgba(236,239,244,.7);--ink-3:rgba(236,239,244,.57);--ink-4:rgba(236,239,244,.5);
  --hair:rgba(255,255,255,.08);--hair-2:rgba(255,255,255,.14);--focus:rgba(255,255,255,.5);--lit:inset 0 1px 0 rgba(255,255,255,.045);
  --paper:#FAF8F5;--paper-2:#F3F0EB;--paper-3:#ECE8E2;--p-ink-1:rgba(20,22,26,.92);--p-ink-2:rgba(20,22,26,.74);--p-ink-3:rgba(20,22,26,.66);--p-ink-4:rgba(20,22,26,.6);
  --p-hair:rgba(20,22,26,.1);--p-hair-2:rgba(20,22,26,.18);--p-focus:rgba(20,22,26,.6);
  --signal:#6d93c9;
  --display:"Inter Tight",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif;--own:"Newsreader",Georgia,serif;--house:"Silkscreen",monospace;
  --t-temp:72px;--t-h2:40px;--t-name:24px;--t-own-xl:22px;--t-own:19px;--t-own-s:16.5px;--t-body:13.5px;--t-small:12.5px;--t-micro:11.5px;--t-label:11px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:72px;--s9:112px;
  --edge:30px;--sheet:560px;--r:14px;--r-s:8px;
  --quick:.18s;--calm:.45s;--slow:.9s;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--floor);color:var(--ink-1);scroll-behavior:smooth}
body{font:400 var(--t-body)/1.5 var(--sans);-webkit-font-smoothing:antialiased;background:var(--floor)}
button{font:inherit;color:inherit}
a{color:inherit}
.own{font-family:var(--own)}
.label{font:500 var(--t-label)/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}

/* ── the mind: fixed behind everything; the hero is a window onto it ── */
canvas#mind{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:pan-y}
canvas#mind.dragging{cursor:grabbing}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--ink-4);font-size:var(--t-small);letter-spacing:.06em;z-index:1}
.hero{position:relative;height:100vh;pointer-events:none;z-index:2}
.hero .ui{position:absolute;pointer-events:auto;text-shadow:0 0 14px rgba(6,6,8,.95),0 0 3px rgba(6,6,8,.9)}
.top{top:26px;left:var(--edge)}
.house{font:400 10px/1 var(--house);letter-spacing:.18em;color:var(--ink-4)}
.who{margin-top:var(--s4);font:500 var(--t-name)/1.15 var(--display);letter-spacing:-.018em}
.who small{display:block;margin-top:7px;font:400 var(--t-small)/1.4 var(--sans);color:var(--ink-3);letter-spacing:0}
.who small.since{color:var(--ink-2)}
.who small.since[hidden]{display:none}
/* what's coming to mind right now: one line, the one blue point breathing while it's fresh, then it rests */
.who small.now{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.who small.now[hidden]{display:none}
.who small.now i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px rgba(109,147,201,.7);transition:opacity 1.2s var(--ease),box-shadow 1.2s var(--ease)}
.who small.now.fresh i{animation:breathe 1.6s ease-in-out infinite}
.who small.now:not(.fresh){color:var(--ink-3)}
.who small.now:not(.fresh) i{box-shadow:none;opacity:.55}
@keyframes breathe{50%{opacity:.45}}
/* ask its memory: one field, the results lit where they live in the mind, and a short list to open them */
.ask{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border-radius:999px;background:rgba(20,20,25,.78);
  border:1px solid transparent;color:var(--ink-3);text-shadow:none;transition:border-color var(--quick),background var(--quick),width var(--calm) var(--ease);width:220px}
.ask:focus-within{border-color:var(--hair-2);background:rgba(16,16,20,.94);width:320px;color:var(--ink-2)}
.ask input{all:unset;flex:1;min-width:0;font:400 var(--t-small)/1 var(--sans);color:var(--ink-1)}
.ask input::placeholder{color:var(--ink-3)}
.ask input::-webkit-search-cancel-button{display:none}
.ask kbd{font:500 10.5px/1 var(--sans);color:var(--ink-4);padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.06)}
.ask:focus-within kbd{display:none}
.ask-list{position:absolute;top:calc(100% + 8px);right:0;width:min(420px,calc(100vw - 32px));max-height:min(60vh,520px);overflow-y:auto;padding:6px;border-radius:14px;
  background:var(--raised);box-shadow:0 0 0 1px var(--hair),0 24px 60px rgba(0,0,0,.55)}
.ask-list[hidden]{display:none}
.ask-list .hit{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:10px 12px;border-radius:9px;border:1px solid transparent}
.ask-list .hit:hover,.ask-list .hit.on{background:var(--surface-2)}
.ask-list .hit:focus-visible{border-color:var(--focus)}
.ask-list .hit .w{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font:400 var(--t-small)/1.45 var(--sans);color:var(--ink-1)}
.ask-list .hit .m{margin-top:4px;color:var(--ink-4);font-size:var(--t-micro);font-variant-numeric:tabular-nums}
.ask-list .say{padding:10px 12px;color:var(--ink-3);font-size:var(--t-small)}
@media (max-width:860px){.ask{width:150px}.ask:focus-within{width:min(260px,calc(100vw - 32px))}.ask kbd{display:none}}
.actions{top:26px;right:var(--edge);display:flex;gap:var(--s2);align-items:center}
.pill{all:unset;cursor:pointer;padding:8px 15px;border-radius:999px;border:1px solid transparent;background:rgba(20,20,25,.78);
  font:450 var(--t-small)/1 var(--sans);color:var(--ink-2);text-shadow:none;transition:color var(--quick),border-color var(--quick),background var(--quick)}
.pill:hover{color:var(--ink-1);border-color:var(--hair-2)}
.pill:focus-visible{border-color:var(--focus);color:var(--ink-1)}
.pill:active{background:rgba(255,255,255,.04)}
.pill[aria-expanded="true"]{color:var(--ink-1);border-color:var(--hair-2);background:rgba(255,255,255,.045)}
.textlink{color:var(--ink-3);text-decoration:none;font-size:var(--t-small);padding:8px 6px;border-bottom:1px solid transparent;transition:color var(--quick),border-color var(--quick)}
.textlink:hover{color:var(--ink-1)}
.textlink:focus-visible{outline:none;color:var(--ink-1);border-bottom-color:var(--focus)}

/* the one large thing: how warm the mind still is */
.foot{left:var(--edge);bottom:30px;max-width:560px}
.temp{font:200 var(--t-temp)/.95 var(--display);letter-spacing:-.035em}
.temp.cold{color:var(--ink-2)}
.hour-line{margin-top:var(--s3);color:var(--ink-2);font-size:var(--t-small);font-variant-numeric:tabular-nums}
.trail-line{margin-top:var(--s1);color:var(--ink-3);font-size:var(--t-small);max-width:52ch}
/* one thing you can verify, kept small: it ran, as itself, and nothing reached past the fence */
.verify{margin-top:var(--s4);display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s1) var(--s3);color:var(--ink-4);font-size:var(--t-micro)}
.verify .flag{color:var(--ink-1)}
.verify .textlink{padding:0;font-size:inherit}
.verify .ok::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--signal);margin-right:6px;vertical-align:1px}
.left-cue{right:var(--edge);bottom:30px;text-align:right}
.left-cue button{all:unset;cursor:pointer;display:block;padding:var(--s2) 0;border-bottom:1px solid transparent;transition:color var(--quick),border-color var(--quick);color:var(--ink-2);font-size:var(--t-small)}
.left-cue button:hover{color:var(--ink-1)}
.left-cue button:focus-visible{border-bottom-color:var(--focus);color:var(--ink-1)}
.left-cue small{display:block;margin-top:var(--s1);color:var(--ink-4);font-size:var(--t-micro)}

/* ── paper: what the hour left, printed. The lit mind above, its impression below ── */
.paper{position:relative;z-index:3;background:var(--paper);color:var(--p-ink-1);padding:var(--s8) var(--edge) var(--s9)}
.paper .wrap{max-width:1180px;margin:0 auto}
.paper .label{color:var(--p-ink-3)}
.paper h2{margin-top:var(--s4);font:250 var(--t-h2)/1.05 var(--display);letter-spacing:-.025em}
.paper .when{margin-top:var(--s3);color:var(--p-ink-2);font-size:var(--t-body);max-width:72ch}
.spread{margin-top:var(--s7);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:28px;row-gap:var(--s6)}
.spread .page{grid-column:1/span 7}
.spread .plates{grid-column:9/span 4;align-self:start;position:sticky;top:var(--s6)}
.entry{max-width:58ch}
.entry + .entry{margin-top:var(--s7)}
.entry .title{font:450 28px/1.22 var(--own);color:var(--p-ink-1);letter-spacing:-.012em;max-width:30ch;hanging-punctuation:first;font-optical-sizing:auto}
.entry .title + .text{margin-top:var(--s4)}
.entry .text{font:400 16.5px/1.75 var(--sans);color:var(--p-ink-1);white-space:pre-wrap;hanging-punctuation:first}
.entry .by{margin-top:var(--s3);color:var(--p-ink-3);font-size:var(--t-micro)}
.none{color:var(--p-ink-3);font-size:var(--t-body);max-width:52ch}
figure.plate{margin:0}
figure.plate + figure.plate{margin-top:var(--s5)}
.plate button{all:unset;cursor:zoom-in;display:block;border:1px solid transparent;border-radius:var(--r-s);overflow:hidden;background:#0b0b0e;transition:border-color var(--quick)}
.plate button:hover img{opacity:.94}
.plate button:focus-visible{border-color:var(--p-focus)}
.plate img{display:block;width:100%;height:auto}
.plate figcaption{margin-top:var(--s2);color:var(--p-ink-3);font-size:var(--t-micro)}
.letter{margin-top:var(--s6);padding:var(--s5);border-radius:var(--r);background:var(--paper-2)}
.letter .label{display:block}
.letter .text{margin-top:var(--s3);font:400 15px/1.7 var(--sans);color:var(--p-ink-1);white-space:pre-wrap}
.letter .by{margin-top:var(--s3);color:var(--p-ink-3);font-size:var(--t-micro)}
.earlier{margin-top:var(--s9)}
.earlier .row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;column-gap:var(--s5);align-items:start;padding:var(--s5);border-radius:var(--r);background:var(--paper-2)}
.earlier .row + .row{margin-top:var(--s2)}
.earlier .t{font:300 18px/1.2 var(--display);letter-spacing:-.01em}
.earlier .t small{display:block;margin-top:var(--s1);font:400 var(--t-micro)/1.4 var(--sans);color:var(--p-ink-3);letter-spacing:0}
.earlier .first{font:450 17px/1.42 var(--own);color:var(--p-ink-2);max-width:60ch;font-optical-sizing:auto}
.earlier .thumbs{display:flex;gap:var(--s2)}
.earlier .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;display:block;background:#0b0b0e}
.earlier details{grid-column:1/-1}
.earlier summary{list-style:none;cursor:pointer;display:inline-block;margin-top:var(--s3);color:var(--p-ink-3);font-size:var(--t-small);border-bottom:1px solid transparent;transition:color var(--quick),border-color var(--quick)}
.earlier summary::-webkit-details-marker{display:none}
.earlier summary:hover{color:var(--p-ink-1)}
.earlier summary:focus-visible{outline:none;color:var(--p-ink-1);border-bottom-color:var(--p-focus)}
.earlier details .spread{margin-top:var(--s5)}
.paper .closing{margin-top:var(--s8);display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);color:var(--p-ink-3);font-size:var(--t-small);max-width:80ch}
.paper .closing a,.paper .closing button{all:unset;cursor:pointer;color:var(--p-ink-2);border-bottom:1px solid var(--p-hair-2);transition:color var(--quick),border-color var(--quick)}
.paper .closing a:hover,.paper .closing button:hover{color:var(--p-ink-1);border-bottom-color:var(--p-ink-3)}
.paper .closing a:focus-visible,.paper .closing button:focus-visible{color:var(--p-ink-1);border-bottom-color:var(--p-focus)}
.paper .promise{margin-top:var(--s5);color:var(--p-ink-4);font-size:var(--t-micro);max-width:80ch}

/* ── the reading room: everything it holds, clean and readable, joined to the mind ── */
.room{position:fixed;top:0;right:0;bottom:0;width:min(var(--sheet),100vw);z-index:6;background:var(--raised);
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform var(--calm) var(--ease);box-shadow:-30px 0 80px rgba(0,0,0,.45)}
.room.open{transform:none}
.room[hidden]{display:none}
.room-head{padding:22px 24px 0}
.room-top{display:flex;justify-content:space-between;align-items:baseline}
.room-top h2{font:300 20px/1.2 var(--display);letter-spacing:-.01em}
.room-top h2:focus{outline:none}                 /* focus is placed here so keys land in the room; it isn't a control */
.close{all:unset;cursor:pointer;color:var(--ink-3);font-size:var(--t-small);padding:4px 8px;border:1px solid transparent;border-radius:6px;transition:color var(--quick),border-color var(--quick)}
.close:hover{color:var(--ink-1)}
.close:focus-visible{border-color:var(--focus);color:var(--ink-1)}
.room-body{flex:1;overflow-y:auto;padding:var(--s4) 24px var(--s8);overscroll-behavior:contain}
.room .tabs{margin-top:var(--s4)}
dialog{margin:auto;border:0;border-radius:var(--r);background:var(--raised);padding:0;max-width:min(92vw,1100px);max-height:92vh;overflow:hidden;color:var(--ink-1)}
dialog::backdrop{background:rgba(6,6,8,.88)}
dialog img{display:block;max-width:min(92vw,1100px);max-height:calc(92vh - 46px);object-fit:contain}
dialog .cap{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4);color:var(--ink-3);font-size:var(--t-small);background:var(--surface-2)}

@media (max-width:860px){
  :root{--edge:16px;--t-temp:52px;--t-h2:30px}
  .actions{top:auto;bottom:auto;right:var(--edge);top:20px}
  .top{top:20px}
  .left-cue{display:none}
  .spread .page,.spread .plates{grid-column:1/-1}
  .spread .plates{position:static}
  .earlier .row{grid-template-columns:1fr;row-gap:var(--s2)}
  .kinds{grid-template-columns:repeat(2,minmax(0,1fr))}
  .room-head{padding:18px 16px 0}
  .room-body{padding:var(--s4) 16px var(--s8)}
  .rowb{padding:var(--s4) var(--s2);margin:0 calc(-1 * var(--s2))}
}
@media (max-width:520px){
  .actions .textlink{display:none}
  .who small{max-width:60vw}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="mind" aria-label="The mind's memory: every cell a memory, every fibre a real link; lit only where its last quiet hour went"></canvas>
<div id="loading">gathering its memories…</div>

<section class="hero" id="hero" aria-label="The mind, still warm">
  <div class="ui top">
    <div class="house">Mnemos</div>
    <div class="who"><span id="who-name">&nbsp;</span>
      <small id="who-sub"></small>
      <small class="since" id="since" hidden></small>
      <small class="now" id="now" aria-live="polite" hidden><i aria-hidden="true"></i><span id="now-text"></span></small>
    </div>
  </div>
  <div class="ui actions">
    <div class="ask" id="ask">
      <svg class="ask-i" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="ask-q" type="search" autocomplete="off" spellcheck="false" placeholder="Ask its memory" aria-label="Ask its memory: find memories by what they mean" aria-controls="ask-list">
      <kbd aria-hidden="true">/</kbd>
      <div class="ask-list" id="ask-list" role="listbox" aria-label="What it found" hidden></div>
    </div>
    <a class="textlink" id="to-log" href="../log/">The log</a>
    <button class="pill" id="open-room" aria-expanded="false" aria-controls="room">Read everything</button>
  </div>
  <div class="ui foot">
    <div class="temp" id="temp">&nbsp;</div>
    <div class="hour-line" id="hour-line"></div>
    <div class="trail-line" id="trail-line"></div>
    <div class="verify" id="verify"></div>
  </div>
  <div class="ui left-cue" id="left-cue" hidden>
    <button id="to-paper">What it left ↓</button>
    <small id="left-sum"></small>
  </div>
</section>

<section class="paper" id="paper" aria-label="What the hour left">
  <div class="wrap" id="paper-wrap"></div>
</section>

<aside class="room sheet" id="room" role="dialog" aria-modal="false" aria-labelledby="room-title" hidden>
  <div class="room-head">
    <div class="room-top"><h2 id="room-title" tabindex="-1">Everything it holds</h2><button class="close" id="close-room">Close</button></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div class="room-body" id="room-body"></div>
</aside>

<dialog id="full"><img id="full-img" alt=""><div class="cap"><span id="full-cap"></span><button class="close" id="full-close" type="button">Close</button></div></dialog>

<script type="module" src="mind.js"></script>
</body>
</html>
